	<!-- generate divs with time starting from 9:00 till the 18:00 with 10 minutes interval 
		and each div should have class "time-block" -->

		<p>9:00</p>
	</div>
	<div class="time-block">
		<p>9:10</p>
	</div>
	<div class="time-block">
		<p>9:20</p>
	</div>
	<div class="time-block">
		<p>9:30</p>
	</div>
	<div class="time-block">
		<p>9:40</p>
	</div>
	<div class="time-block">
		<p>9:50</p>
	</div>
</body>
</html>
